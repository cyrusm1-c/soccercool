<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First JS Game</title>
    <style>
        body {
            margin: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 4px solid #fff;
            background: #222;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        // --- 1. SETUP CANVAS & CONTEXT ---
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d"); // Gives access to 2D drawing methods

        // --- 2. GAME STATE (VARIABLES) ---
        const player = {
            x: 375,
            y: 500,
            width: 50,
            height: 50,
            speed: 7,
            color: "#3498db"
        };

        const obstacle = {
            ctx.beginPath();
            // Parameters: x, y, radius, startAngle, endAngle
            ctx.arc(100, 100, 50, 0, 2 * Math.PI); 

            // Style and draw
            ctx.fillStyle = "blue";
            ctx.fill();       // Fills the circle
            ctx.lineWidth = 3;
            ctx.strokeStyle = "black";
            ctx.stroke();     // Draws the outline
        };

        let keys = {};
        let score = 0;
        let isGameOver = false;

        // --- 3. INPUT HANDLING ---
        window.addEventListener("keydown", (e) => keys[e.code] = true);
        window.addEventListener("keyup", (e) => keys[e.code] = false);

        // --- 4. GAME MECHANICS & LOGIC ---
        function update() {
            if (isGameOver) return;

            // Move player left/right & keep within boundaries
            if (keys["ArrowLeft"] && player.x > 0) player.x -= player.speed;
            if (keys["ArrowRight"] && player.x < canvas.width - player.width) player.x += player.speed;

            // Move obstacle downward
            obstacle.y += obstacle.speed;

            // Reset obstacle if it goes off screen
            if (obstacle.y > canvas.height) {
                obstacle.y = 0;
                obstacle.x = Math.random() * (canvas.width - obstacle.width);
                score++;
                obstacle.speed += 0.5; // Gradually increase difficulty
            }

            // AABB Collision Detection
            if (
                player.x < obstacle.x + obstacle.width &&
                player.x + player.width > obstacle.x &&
                player.y < obstacle.y + obstacle.height &&
                player.y + player.height > obstacle.y
            ) {
                isGameOver = true;
            }
        }

        // --- 5. RENDERING (DRAWING GRAPHICS) ---
        function draw() {
            // Clear the canvas from previous frames
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Player
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Draw Obstacle
            ctx.fillStyle = obstacle.color;
            ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);

            // Draw Score
            ctx.fillStyle = "#fff";
            ctx.font = "24px Arial";
            ctx.fillText(`Score: ${score}`, 20, 40);

            // Draw Game Over Text
            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#fff";
                ctx.font = "48px Arial";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2);
                ctx.font = "24px Arial";
                ctx.fillText("Refresh the page to play again", canvas.width / 2, canvas.height / 2 + 50);
            }
        }

        // --- 6. THE GAME LOOP ---
        function gameLoop() {
            update();
            draw();
            // Built-in browser method optimized for smooth animations
            requestAnimationFrame(gameLoop); 
        }

        // Start the engine
        gameLoop();
    </script>
</body>
</html>
