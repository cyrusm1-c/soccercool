<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single File HTML5 Game</title>
    
    <!-- 1. EMBEDDED CSS (STYLING) -->
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            text-align: center;
        }
        canvas {
            background-color: #111;
            border: 4px solid #444;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            display: block;
        }
        .ui-text {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 2. HTML STRUCTURE -->
    <div id="game-container">
        <div class="ui-text">Score: <span id="score-display">0</span></div>
        <!-- The canvas serves as our graphical whiteboard -->
        <canvas id="gameCanvas" width="600" height="400"></canvas>
    </div>

    <!-- 3. EMBEDDED JAVASCRIPT (GAME LOGIC) -->
    <script>
        // --- Setup Canvas and Context ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');

        // --- Game State ---
        let score = 0;
        
        // Player properties
        const player = {
            x: canvas.width / 2 - 20,
            y: canvas.height - 50,
            width: 40,
            height: 40,
            speed: 8,
            color: '#00ffcc'
        };

        // Target (Collectible) properties
        const target = {
            x: Math.random() * (canvas.width - 30),
            y: 0,
            radius: 15,
            speed: 4,
            color: '#ff4444'
        };

        // Track keyboard inputs
        const keys = {
            ArrowLeft: false,
            ArrowRight: false
        };

        // --- Input Listeners ---
        window.addEventListener('keydown', (e) => {
            if (e.key in keys) keys[e.key] = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key in keys) keys[e.key] = false;
        });

        // --- Game Functions ---
        function resetTarget() {
            target.x = Math.random() * (canvas.width - target.width);
            target.y = 0;
            // Slightly increase speed as score goes up to add difficulty
            target.speed = 4 + Math.floor(score / 5);
        }

        function update() {
            // Move player left/right and keep them on screen
            if (keys.ArrowLeft && player.x > 0) {
                player.x -= player.speed;
            }
            if (keys.ArrowRight && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }

            // Move falling target downwards
            target.y += target.speed;

            // Check Collision: Player catches the target
            if (player.x < target.x + target.width &&
                player.x + player.width > target.x &&
                player.y < target.y + target.height &&
                player.y + player.height > target.y) {
                score++;
                scoreDisplay.textContent = score;
                resetTarget();
            }

            // Check Miss: Target hits the bottom of the screen
            if (target.y > canvas.height) {
                score = 0; // Reset score on miss
                scoreDisplay.textContent = score;
                resetTarget();
            }
        }

        function draw() {
            // Clear the entire canvas board before drawing the next frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Player
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Draw Falling Target
            ctx.beginPath();
            // Parameters: x, y, radius, startAngle, endAngle
            ctx.arc(target.x, target.y, target.radius, 0, 2 * Math.PI);

            // Optional: Add color and render
            ctx.fillStyle = targot.color;
            ctx.fill();

            ctx.lineWidth = 3;
            ctx.strokeStyle = "black";
            ctx.stroke();
        // --- Core Game Loop ---
        function gameLoop() {
            update();
            draw();
            // Automatically invokes the loop synced with the screen refresh rate (~60fps)
            requestAnimationFrame(gameLoop);
        }

        // Initialize the game loop
        gameLoop();
    </script>
</body>
</html>
