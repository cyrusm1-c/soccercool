<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single File HTML5 Game</title>
    <style>
        /* 1. CSS STYLING */
        body {
            margin: 0;
            background: #222;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #scoreBoard {
            font-size: 24px;
            margin-bottom: 10px;
        }
        canvas {
            background: #111;
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- 2. HTML STRUCTURE -->
    <div id="scoreBoard">Score: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <!-- 3. JAVASCRIPT LOGIC -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        // Game State
        let score = 0;
        let gameOver = false;

        // Player (Circle - positioned near the bottom)
        const player = {
            radius: 20,
            x: 300, // Balanced starting X coordinate (middle of 600px width)
            y: 370, 
            speed: 7,
            dx: 0
        };

        // Falling Object (Circle)
        const item = {
            radius: 12,
            x: 0, 
            y: 0, 
            speed: 4
        };

        // Initialize item position safely within walls
        resetItem();

        // Keyboard Controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'd') player.dx = player.speed;
            if (e.key === 'ArrowLeft' || e.key === 'a') player.dx = -player.speed;
            
            // Restart game with Spacebar or Enter when Game Over
            if (gameOver && (e.key === ' ' || e.key === 'Enter')) {
                resetGame();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (['ArrowRight', 'ArrowLeft', 'a', 'd'].includes(e.key)) player.dx = 0;
        });

        // Reset Game Variables
        function resetGame() {
            score = 0;
            gameOver = false;
            scoreElement.innerText = score;
            player.x = canvas.width / 2;
            player.dx = 0;
            item.speed = 4;
            resetItem();
        }

        // Reset Item to Top
        function resetItem() {
            item.x = item.radius + Math.random() * (canvas.width - item.radius * 2);
            item.y = -item.radius; // Spawns cleanly above viewable area
        }

        // Update Game Objects
        function update() {
            if (gameOver) return;

            // Move Player & Keep Circle In Bounds
            player.x += player.dx;
            if (player.x - player.radius < 0) {
                player.x = player.radius;
            }
            if (player.x + player.radius > canvas.width) {
                player.x = canvas.width - player.radius;
            }

            // Move Falling Item
            item.y += item.speed;

            // Check Circle-to-Circle Collision
            const distX = item.x - player.x;
            const distY = item.y - player.y;
            const distance = Math.sqrt(distX * distX + distY * distY);

            if (distance < player.radius + item.radius) {
                score++;
                scoreElement.innerText = score;
                resetItem();
                item.speed += 0.5; // Increase difficulty
            }

            // Check if Item Hit Bottom (Game Over)
            if (item.y - item.radius > canvas.height) {
                gameOver = true;
            }
        }

        // Draw Everything
        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Player (Circle)
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#00ffcc';
            ctx.fill();
            ctx.closePath();

            // Draw Falling Item (Circle)
            ctx.beginPath();
            ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#4feb34';
            ctx.fill();
            ctx.closePath();

            // Draw Game Over Screen
            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = 'white';
                ctx.font = '30px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
                
                ctx.font = '16px sans-serif';
                ctx.fillStyle = '#bbbbbb';
                ctx.fillText('Press Spacebar or Enter to Play Again', canvas.width / 2, canvas.height / 2 + 30);
            }
        }

        // Main Game Loop
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Start the game
        loop();
    </script>
</body>
</html>
